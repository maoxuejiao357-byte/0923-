<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四象限Todo List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 顶部标题和添加任务区域 -->
        <header class="header">
            <h1>四象限Todo List</h1>
            <div class="add-task-section">
                <input type="text" id="taskInput" placeholder="输入新任务..." class="task-input">
                <select id="categorySelect" class="category-select">
                    <option value="业务端">业务端</option>
                    <option value="运营内部">运营内部</option>
                    <option value="AI">AI</option>
                </select>
                <select id="prioritySelect" class="priority-select">
                    <option value="P1">P1 - 紧急且重要</option>
                    <option value="P2">P2 - 重要但不紧急</option>
                    <option value="P3">P3 - 紧急但不重要</option>
                    <option value="P4">P4 - 不紧急不重要</option>
                </select>
                <input type="date" id="dueDateInput" class="due-date-input">
                <button id="addTaskBtn" class="add-btn">添加任务</button>
            </div>
        </header>

        <!-- 导航标签 -->
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="todo">Todo List</button>
            <button class="tab-btn" data-tab="notepad">记事本</button>
        </nav>

        <div class="main-content">
            <!-- Todo List 内容 -->
            <div id="todoContent" class="tab-content active">
                <!-- 左侧分类菜单 -->
                <aside class="sidebar">
                <div class="search-section">
                    <input type="text" id="searchInput" placeholder="搜索任务..." class="search-input">
                </div>
                
                <div class="filter-section">
                    <h3>分类筛选</h3>
                    <div class="filter-group">
                        <button class="filter-btn active" data-category="all">全部</button>
                        <button class="filter-btn" data-category="业务端">业务端</button>
                        <button class="filter-btn" data-category="运营内部">运营内部</button>
                        <button class="filter-btn" data-category="AI">AI</button>
                    </div>
                    
                    <h3>优先级筛选</h3>
                    <div class="filter-group">
                        <button class="filter-btn active" data-priority="all">全部</button>
                        <button class="filter-btn priority-p1" data-priority="P1">P1</button>
                        <button class="filter-btn priority-p2" data-priority="P2">P2</button>
                        <button class="filter-btn priority-p3" data-priority="P3">P3</button>
                        <button class="filter-btn priority-p4" data-priority="P4">P4</button>
                    </div>
                    
                    <h3>状态筛选</h3>
                    <div class="filter-group">
                        <button class="filter-btn active" data-status="all">全部</button>
                        <button class="filter-btn" data-status="pending">未完成</button>
                        <button class="filter-btn" data-status="completed">已完成</button>
                    </div>
                </div>
            </aside>

            <!-- 右侧任务列表 -->
            <main class="task-list-container">
                <div class="task-stats">
                    <span id="totalTasks">总任务: 0</span>
                    <span id="completedTasks">已完成: 0</span>
                    <span id="pendingTasks">待完成: 0</span>
                </div>
                
                <div id="taskList" class="task-list">
                    <!-- 任务项将通过JavaScript动态生成 -->
                </div>
                
                <div id="emptyState" class="empty-state">
                    <p>暂无任务，点击上方添加新任务吧！</p>
                </div>
                </main>
            </div>
            
            <!-- 记事本内容 -->
            <div id="notepadContent" class="tab-content">
                <div class="notepad-container">
                    <div class="notepad-header">
                        <h2>我的记事本</h2>
                        <div class="notepad-controls">
                            <button id="saveNoteBtn" class="save-note-btn">保存</button>
                            <button id="clearNoteBtn" class="clear-note-btn">清空</button>
                            <span id="saveStatus" class="save-status"></span>
                        </div>
                    </div>
                    <div class="notepad-editor">
                        <textarea id="notepadTextarea" placeholder="在这里记录你的想法、笔记或任何重要信息...\n\n支持自动保存功能，你的内容会安全保存在本地。"></textarea>
                    </div>
                    <div class="notepad-footer">
                        <div class="word-count">
                            <span id="charCount">字符数: 0</span>
                            <span id="wordCount">单词数: 0</span>
                        </div>
                        <div class="last-saved">
                            <span id="lastSaved">未保存</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑任务模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>编辑任务</h2>
            <form id="editForm">
                <input type="text" id="editTaskInput" placeholder="任务内容" required>
                <select id="editCategorySelect">
                    <option value="业务端">业务端</option>
                    <option value="运营内部">运营内部</option>
                    <option value="AI">AI</option>
                </select>
                <select id="editPrioritySelect">
                    <option value="P1">P1 - 紧急且重要</option>
                    <option value="P2">P2 - 重要但不紧急</option>
                    <option value="P3">P3 - 紧急但不重要</option>
                    <option value="P4">P4 - 不紧急不重要</option>
                </select>
                <input type="date" id="editDueDateInput">
                <div class="modal-buttons">
                    <button type="submit" class="save-btn">保存</button>
                    <button type="button" class="cancel-btn">取消</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
